# Componentes que distribuye APS Conecta Gestión (iniciativa scribe, Q14). Claves en inglés y
# valores en español, como catalogo.yml.
#
# Una persona declara aquí lo que solo una persona sabe: de dónde viene cada componente, su
# licencia (SPDX, leída del propio componente) y, si APS lo modifica, qué cambia. Lo demás lo
# calcula tools/gen-componentes.py en cada compilación desde el repositorio de la suite
# (gestion): la versión de cada aplicación (el checkout de su propio repositorio; «—» cuando
# la suite la resuelve al instalar) y la de cada imagen base (el FROM del contenedor que la
# suite distribuye, php/containers.json → Containers/). La compilación falla si la suite
# distribuye algo que no figura aquí, o si aquí figura algo que la suite ya no distribuye.
#
# kind:
#   image    imagen base de un contenedor que la suite distribuye (el FROM de su Dockerfile),
#            o el servidor Nextcloud que el contenedor nextcloud empaqueta (id nextcloud)
#   app      aplicación Nextcloud de terceros que el manifiesto de la suite (apps.json) instala
#   own-app  aplicación propia de APS (repositorio de la organización) o fork propio de un upstream
#   fork     repositorio de la organización que bifurca un proyecto upstream; `id` = repositorio
#   asset    archivo de terceros que sirve el tema; `id` = ruta en gestion
#   data     datos de terceros que distribuye la suite; `id` = ruta en gestion
#
# AIO: el LICENSE upstream es la AGPL v3 sin cláusula «o posterior» (GitHub la detecta como AGPL-3.0,
# que en SPDX equivale a AGPL-3.0-only). Upstreams de eurooffice e IntraVox leídos del info.xml del
# paquete y del padre del fork en GitHub (2026-10-09); licencias de las imágenes base leídas del
# propio upstream el 2026-10-24.
#
# Fuente de las licencias: esta tabla es el inventario de terceros de la organización (las
# licencias se verificaron contra cada proyecto el 2026-07-19 y 2026-07-30, contra el info.xml de
# cada paquete y contra cada upstream de imagen el 2026-10-24).

components:
  # ---- Servicios (imágenes base de los contenedores que la suite distribuye)
  - {name: Servidor Nextcloud, kind: image, id: nextcloud, upstream: "https://github.com/nextcloud/server", licence: AGPL-3.0-or-later}
  - {name: PostgreSQL, kind: image, id: postgres, upstream: "https://www.postgresql.org/", licence: PostgreSQL}
  - {name: Redis, kind: image, id: redis, upstream: "https://github.com/redis/redis", licence: AGPL-3.0-or-later, note: "Redis 8 ofrece tres licencias; APS Conecta elige la AGPL v3."}
  - {name: Euro-Office (servidor de documentos), kind: image, id: ghcr.io/euro-office/documentserver, upstream: "https://github.com/Euro-Office/DocumentServer", licence: AGPL-3.0-only}
  - {name: Alpine (base), kind: image, id: alpine, upstream: "https://github.com/alpinelinux/docker-alpine", licence: BSD-3-Clause, note: "La licencia de cada paquete es la del paquete; la base, BSD-3-Clause."}
  - {name: PHP (base del servidor), kind: image, id: php, upstream: "https://github.com/php/php-src", licence: PHP-3.01}
  - {name: Apache HTTP Server (base), kind: image, id: httpd, upstream: "https://github.com/apache/httpd", licence: Apache-2.0}
  - {name: Caddy (base de Apache & Caddy), kind: image, id: caddy, upstream: "https://github.com/caddyserver/caddy", licence: Apache-2.0}
  - {name: Go (base de compilación), kind: image, id: golang, upstream: "https://github.com/golang/go", licence: BSD-3-Clause}
  - {name: Python (base), kind: image, id: python, upstream: "https://github.com/python/cpython", licence: PSF-2.0}
  - {name: Elasticsearch (búsqueda de texto completo), kind: image, id: elasticsearch, upstream: "https://github.com/elastic/elasticsearch", licence: "Elastic-2.0 OR SSPL-1.0", note: "Licencia dual, ninguna aprobada por la OSI."}
  - {name: NATS Server (base de Talk), kind: image, id: nats, upstream: "https://github.com/nats-io/nats-server", licence: Apache-2.0}
  - {name: eturnal (TURN de Talk), kind: image, id: eturnal/eturnal, upstream: "https://github.com/processone/eturnal", licence: Apache-2.0}
  - {name: Señalización de Talk, kind: image, id: strukturag/nextcloud-spreed-signaling, upstream: "https://github.com/strukturag/nextcloud-spreed-signaling", licence: AGPL-3.0}
  - {name: HaRP (proxy de AppAPI), kind: image, id: ghcr.io/nextcloud/nextcloud-appapi-harp, upstream: "https://github.com/nextcloud/HaRP", licence: AGPL-3.0}

  # ---- Aplicaciones Nextcloud de terceros (las instala el manifiesto de la suite)
  - {name: Carpetas de grupo, kind: app, id: groupfolders, upstream: "https://github.com/nextcloud/groupfolders", licence: AGPL-3.0-or-later}
  - {name: Conector de Euro-Office, kind: app, id: eurooffice, upstream: "https://github.com/Euro-Office/eurooffice-nextcloud", fork: "https://github.com/APS-Conecta/eurooffice", licence: AGPL-3.0-only, changes: "Nombre de la sección de administración y nombre visible de la aplicación."}
  - {name: Menú lateral, kind: own-app, id: side_menu, upstream: "https://gitnet.fr/deblan/side_menu", fork: "https://github.com/APS-Conecta/side_menu", licence: AGPL-3.0-or-later, changes: "Mantenimiento propio: la fuente original está inaccesible; la suite publica y firma sus versiones."}
  - {name: Talk, kind: own-app, id: spreed, upstream: "https://github.com/nextcloud/spreed", fork: "https://github.com/APS-Conecta/spreed", licence: AGPL-3.0-or-later, changes: "Fork propio con releases firmadas por la suite (ADR-0020): el chat y las videollamadas del establecimiento llegan desde su propio repositorio."}
  - {name: Calendario, kind: app, id: calendar, upstream: "https://github.com/nextcloud/calendar", licence: AGPL-3.0-or-later}
  - {name: Contactos, kind: app, id: contacts, upstream: "https://github.com/nextcloud/contacts", licence: AGPL-3.0-or-later}
  - {name: Notify Push, kind: app, id: notify_push, upstream: "https://github.com/nextcloud/notify_push", licence: AGPL-3.0-or-later}
  - {name: Antivirus de archivos, kind: app, id: files_antivirus, upstream: "https://github.com/nextcloud/files_antivirus", licence: AGPL-3.0-or-later}

  # ---- Aplicaciones propias de APS Conecta
  - {name: Protección de cargas, kind: own-app, id: files_upload_guard, repo: files-upload-guard, upstream: "https://github.com/APS-Conecta/files-upload-guard", licence: AGPL-3.0-or-later}
  - {name: Epidemiología, kind: own-app, id: epidemiologia, upstream: "https://github.com/APS-Conecta/epidemiologia", licence: AGPL-3.0-or-later}
  - {name: Farmacia, kind: own-app, id: farmacia, upstream: "https://github.com/APS-Conecta/farmacia", licence: AGPL-3.0-or-later}
  - {name: Territorio, kind: own-app, id: territorio, upstream: "https://github.com/APS-Conecta/territorio", licence: AGPL-3.0-or-later}
  - {name: Estadística, kind: own-app, id: estadistica, upstream: "https://github.com/APS-Conecta/estadistica", licence: AGPL-3.0-or-later}
  - {name: Tótem, kind: own-app, id: totem, upstream: "https://github.com/APS-Conecta/totem", licence: AGPL-3.0-or-later}
  - {name: Inicio (IntraVox), kind: own-app, id: intravox, upstream: "https://github.com/nextcloud/IntraVox", fork: "https://github.com/APS-Conecta/IntraVox", licence: AGPL-3.0-or-later, changes: "Fork con funciones locales: muros y páginas protegidas, portada de bienvenida administrada, raíz de almacenamiento con nombre para el personal y el idioma español por defecto (IntraVox ADR-0001)."}

  # ---- Instalador
  - {name: Nextcloud All-in-One (gestion), kind: fork, id: gestion, upstream: "https://github.com/nextcloud/all-in-one", fork: "https://github.com/APS-Conecta/gestion", licence: AGPL-3.0-only, changes: "Asistente en español de Chile con la marca y el nombre del producto, Euro-Office como única suite ofimática, tienda de aplicaciones cerrada que abre solo para sus comandos acotados, autoactualización y contenedores comunitarios desactivados, aplicaciones desde sus publicaciones firmadas y solo el tema en la imagen, imágenes propias en el registro, valores por defecto de APS, certificado del instalador y base de datos única con pgvector."}

  # ---- Recursos del tema
  - {name: Tipografía Fraunces, kind: asset, id: themes/apsconecta/core/fonts, upstream: "https://github.com/undercasetype/Fraunces", licence: OFL-1.1, changes: "Servida en WOFF2; un subconjunto va incrustado en los logotipos SVG (versión modificada según la OFL, sin los nombres reservados)."}
  - {name: Tipografía Nunito Sans, kind: asset, id: themes/apsconecta/core/fonts, upstream: "https://github.com/googlefonts/NunitoSans", licence: OFL-1.1, changes: "Servida en WOFF2; un subconjunto va incrustado en los logotipos SVG (versión modificada según la OFL, sin los nombres reservados)."}
  - {name: Leaflet, kind: asset, id: themes/apsconecta/core/mapa/leaflet.js, upstream: "https://github.com/Leaflet/Leaflet", licence: BSD-2-Clause, version: "1.9.4"}

  # ---- Datos
  - {name: Registro de establecimientos (DEIS) con coordenadas del Geoportal de Chile, kind: data, id: sites, upstream: "https://deis.minsal.cl/", licence: "sin licencia declarada", note: "Datos públicos del MINSAL; crédito «Puntos: MINSAL/DEIS, Geoportal de Chile»."}
