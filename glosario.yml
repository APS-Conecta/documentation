# Glosario de la plataforma base (iniciativa scribe, Q24): el término de la interfaz en inglés,
# el que la interfaz en español muestra, y el archivo de traducciones del servidor que lo dice.
# Fuente: nextcloud/server rama stable34, <fuente>/l10n/es.json. Los traductores y revisores del
# tejido lo usan; tools/gen-glosario.py lo publica en proyecto/glosario. Agregar un término
# exige citar su archivo de traducciones.
server_branch: stable34
terms:
  - {en: "Files", es: "Archivos", source: apps/files}
  - {en: "All files", es: "Todos los archivos", source: apps/files}
  - {en: "Recent", es: "Reciente", source: apps/files}
  - {en: "Favorites", es: "Favoritos", source: apps/files}
  - {en: "Shares", es: "Compartidos", source: apps/files_sharing}
  - {en: "Deleted files", es: "Archivos eliminados", source: apps/files_trashbin}
  - {en: "Share", es: "Compartir", source: apps/files}
  - {en: "Shared with you", es: "Compartido conmigo", source: apps/files_sharing}
  - {en: "Share link", es: "Compartir enlace", source: apps/files_sharing}
  - {en: "Upload", es: "Subir", source: apps/files_sharing}
  - {en: "New folder", es: "Nueva carpeta", source: apps/files}
  - {en: "Rename", es: "Renombrar", source: apps/files}
  - {en: "Move or copy", es: "Mover o copiar", source: apps/files}
  - {en: "Download", es: "Descargar", source: apps/files}
  - {en: "Delete", es: "Eliminar", source: apps/files}
  - {en: "Versions", es: "Versiones", source: apps/files_versions}
  - {en: "Restore", es: "Recuperar", source: apps/files_trashbin}
  - {en: "Settings", es: "Ajustes", source: apps/settings}
  - {en: "Personal info", es: "Información personal", source: apps/settings}
  - {en: "Security", es: "Seguridad", source: apps/settings}
  - {en: "Administration settings", es: "Configuraciones de administración", source: apps/settings, evitar: ["ajustes de administración"]}
  - {en: "Users", es: "Usuarios", source: apps/settings}
  - {en: "Groups", es: "Grupos", source: apps/settings}
  - {en: "Apps", es: "Apps", source: apps/settings}
  - {en: "Log out", es: "Cerrar sesión", source: core}
  - {en: "Search", es: "Buscar", source: apps/files}
  - {en: "Password", es: "Contraseña", source: apps/files_sharing}
  - {en: "Two-factor authentication", es: "Autenticación de dos factores", source: core}
  - {en: "Display name", es: "Nombre mostrado", source: apps/settings}
  - {en: "Email", es: "Correo electrónico", source: apps/files_sharing}
  - {en: "Quota", es: "Cuota", source: apps/settings}
  - {en: "Details", es: "Detalles", source: apps/files}
  - {en: "Tags", es: "Etiquetas", source: apps/files}
  - {en: "Expiration date", es: "Fecha de caducidad", source: apps/files_sharing}
  - {en: "Allow editing", es: "Permitir edición", source: apps/files_sharing}
  - {en: "Remote Subfolder", es: "Subcarpeta remota", source: apps/files_external}
  - {en: "Enforce password protection", es: "Forzar la protección por contraseña", source: apps/settings}
  - {en: "Allow public uploads", es: "Permitir subidas públicas", source: apps/settings}

# Términos técnicos (S5, aprobados por el responsable en el PR): la forma aprobada `es` y las
# variantes que la documentación ya no usa (`evitar`). tools/term-check.py rechaza una variante
# `evitar` en toda la prosa y, si el término tiene `en`, exige la forma aprobada en cada bloque
# {upstream} cuya sección upstream lo usa (`re`: cómo se reconoce el término en inglés). Sin `en`,
# solo se evitan las variantes: el español admite otras formas («equipo» también es «computer»).
# Las cuentas vienen de la minería del corpus tejido (bloques que usaron cada forma).
tecnicos:
  - {en: backend, re: '(?<!database )back-?ends?', es: backend, evitar: [back-end, back end]}  # «database backend»: «motor de base de datos»
  - {en: frontend, es: frontend, evitar: [front-end, front end]}
  - {en: log, re: '(?:(?:the|a|your|server|error|audit|access|debug|system|PHP|Nextcloud) logs?|logs(?! (?:in|into|out)\b)|log (?:files?|levels?|entr(?:y|ies)|messages?|rotation))', es: registro, evitar: [el log, los logs, del log, un log, archivo de log, archivos de log]}
  - {en: hook, re: '(?:hooks|(?:a|the|this) hook)(?! into)', es: hook, evitar: [gancho, ganchos]}  # «hook into» es un verbo
  - {en: listener, re: 'event listeners?', es: listener, evitar: [receptor de eventos, receptores de eventos]}  # en Talk, «listeners» es el público: «oyentes»
  - {en: endpoint, es: endpoint, evitar: [punto final, puntos finales, punto de conexión, puntos de conexión]}
  - {en: pull request, es: pull request, evitar: [solicitud de extracción, solicitudes de extracción, solicitud de incorporación, solicitudes de incorporación]}
  - {en: backport, es: backport, evitar: [retroportar, retroportado, retroportada, retroportados, retroportadas]}
  - {en: cache, es: caché}
  - {es: computador, evitar: [ordenador, ordenadores]}
  - {es: archivo, evitar: [fichero, ficheros]}
