# build — the R2 evidence pipeline: sphinx -W via the Makefile contract, linkcheck,
# actionlint, Playwright on served HTML; Pages deploy from main only (the org's first).
# The workflow owns no repo list (the roster is catalogo.yml), invokes no generator
# and no raw sphinx invocation — every gate wraps a make target, so -W --keep-going
# lives in exactly one place, the Makefile. Token consumption is ambient GH_TOKEN
# env, never argv or URL; the App token is minted read-scoped, roster-fed.
name: build

on:
  push:
    branches: [main]     # main-only push: a PR is never checked twice
  pull_request:
  workflow_dispatch:     # token-reach verification on any branch; deploy stays gated
  schedule:
    - cron: "30 9 * * *"  # daily, after 📚 Scribe (09:00 UTC): generated pages follow every repo's main

permissions: {}          # GITHUB_TOKEN is never used for a write; build re-grants read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing after checkout authenticates as the workflow identity
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyyaml   # pyyaml for the roster parse; the site toolchain stays the four pins
      - name: Roster (the 15, from catalogo.yml — the workflow owns no repo list)
        id: roster
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          print("repos<<REPOS")
          for row in yaml.safe_load(open("catalogo.yml"))["repos"]:
              print(row["repo"])
          print("REPOS")
          PY
      - name: Mint App token (read-scoped, roster-fed)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APS_BOT_APP_ID }}
          private-key: ${{ secrets.APS_BOT_APP_KEY }}
          permission-contents: read    # clones + gh api reads, nothing else
          repositories: ${{ steps.roster.outputs.repos }}   # OQ5 sidestep; one-line fallback: drop this input
      - name: Clone the roster (RUNNER_TEMP boundary; a failed clone fails the job)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}   # gh reads it; never URL/argv
          ROSTER: ${{ steps.roster.outputs.repos }}
          APS_ORG_ROOT: ${{ runner.temp }}/org         # clones land outside the checkout
        run: |
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            gh repo clone "APS-Conecta/$repo" "${APS_ORG_ROOT}/$repo" -- --depth 1
          done <<< "$ROSTER"
      - name: Install actionlint 1.7.12
        run: |
          curl -sSfL -o /tmp/actionlint_1.7.12_linux_amd64.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -sSfL -o /tmp/checksums.txt \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt"
          # the tarball keeps its asset name: sha256sum --check matches checksums.txt's
          # entries by filename, and --ignore-missing would silently skip a renamed file
          cd /tmp && sha256sum --check --ignore-missing checksums.txt
          sudo tar -xzf actionlint_1.7.12_linux_amd64.tar.gz -C /usr/local/bin actionlint
          actionlint --version
      - name: Lint workflows
        run: actionlint .github/workflows/*.yml
      - name: "Site build (the make contract: -W --keep-going lives in the Makefile)"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}   # gen-catalogo.py live visibility
          APS_ORG_ROOT: ${{ runner.temp }}/org         # the generators' sibling-checkout contract
          GESTION_SRC: ${{ runner.temp }}/org/gestion  # fetch-brand.sh resolution branch 1
        run: make html
      - name: Linkcheck (ignore seed = _generated/linkcheck-private.txt via conf.py)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APS_ORG_ROOT: ${{ runner.temp }}/org         # the generate chain runs here too
        run: make linkcheck
      - name: Chromium (aps-conecta-web theme.yml shape)
        run: |
          pip install --quiet playwright
          playwright install --with-deps --only-shell chromium
      - name: Served-site gate
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}   # gen-catalogo.py live visibility
          APS_ORG_ROOT: ${{ runner.temp }}/org         # the generate chain runs here too
          GESTION_SRC: ${{ runner.temp }}/org/gestion  # fetch-brand.sh resolution branch 1
        run: make check-site
      - name: Pages artifact (main only)
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _build/html

  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false   # a superseded deploy completes rather than dies mid-flight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
