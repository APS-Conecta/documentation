# Documentation gate: the site's own structure check, plus the secret scan the
# repository still owes inline — GitHub secret scanning is off here, so gitleaks
# covers the PR or push range until native scanning replaces it (docs-SSOT T02's
# fallback; the org ruleset requires this job's id and name: `docs`).
name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    # job level: a step's own `env:` is not visible to that step's `if`, so the
    # range the scan guards on lives here, where every step can read it
    env:
      # two-dot: git log A..B is one-sided (the PR's own commits); three-dot would
      # sweep base-side merges once main advances. Push scans the pushed commits
      # only — a full-source scan would fire on history the repos cannot rewrite.
      RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.event.after) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0          # the PR range scan needs the base commit's ancestry
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks_8.30.1_linux_x64.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL -o /tmp/checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt"
          # the tarball keeps its asset name: sha256sum --check matches checksums.txt's
          # entries by filename, and --ignore-missing would silently skip a renamed file
          cd /tmp && sha256sum --check --ignore-missing checksums.txt
          sudo tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secret scan (the range, never history)
        if: env.RANGE != ''
        run: gitleaks detect --no-banner --redact --source . --log-opts "$RANGE"
      - name: Site structure (front matter and H2 skeletons, the make contract)
        run: make structure
