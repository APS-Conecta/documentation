# ia-check — no AI writes in the organisation's repositories without being declared in ia.yml
# (iniciativa scribe, Q25). Weekly and on demand: clones every catalogo.yml repo with FULL
# history (a shallow clone hides the commits the check must read) and runs tools/ia-check.py,
# which fails on an undeclared Co-Authored-By model or bot author in APS-authored commits. The
# App token is minted read-scoped and roster-fed, as in build.yml.
name: ia-check

on:
  schedule:
    - cron: "41 6 * * 1"   # Mondays, before the 07:30 weekly report
  workflow_dispatch:

permissions: {}

jobs:
  ia-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Roster (from catalogo.yml)
        id: roster
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          print("repos<<REPOS")
          for row in yaml.safe_load(open("catalogo.yml"))["repos"]:
              print(row["repo"])
          print("REPOS")
          PY
      - name: Mint App token (read-scoped, roster-fed)
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APS_BOT_APP_ID }}
          private-key: ${{ secrets.APS_BOT_APP_KEY }}
          permission-contents: read
          repositories: ${{ steps.roster.outputs.repos }}
      - name: Clone the roster with full history
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ROSTER: ${{ steps.roster.outputs.repos }}
          APS_ORG_ROOT: ${{ runner.temp }}/org
        run: |
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            gh repo clone "APS-Conecta/$repo" "${APS_ORG_ROOT}/$repo" -- --filter=blob:none --no-checkout --quiet
          done <<< "$ROSTER"
      - name: Selftest
        run: python3 tools/ia-check.py --selftest
      - name: Check
        env:
          APS_ORG_ROOT: ${{ runner.temp }}/org
        run: python3 tools/ia-check.py
