# Uso de inteligencia artificial en APS Conecta. Claves en inglés y
# valores en español, como catalogo.yml. Una persona declara aquí cada herramienta de IA que
# escribe en los repositorios de la organización, sus modelos, qué hace, desde cuándo y cómo se
# revisa su trabajo. tools/gen-ia.py publica la tabla del aviso legal; tools/ia-check.py
# recorre el historial posterior al 2026-10-20 de los repositorios del catálogo y falla si un commit de APS trae
# un modelo coautor (Co-Authored-By) o un bot autor que este archivo no declara.
#
# Fuente de la primera versión (2026-10-09): los trailers Co-Authored-By de los commits con
# identidad de APS (el historial upstream de los forks queda fuera). Lo que ningún registro dice
# se escribe como tal, nunca se supone.

# Autores que cuentan como APS: el historial upstream de instalador e IntraVox no se revisa.
identities:
  - Dani Espinoza Charrier
  - Daniel Espinoza Charrier
  - ddespinoza
  - root
  - Claude
  - "claude[bot]"

# Coautores humanos y bots sin IA (automatización determinista): no son herramientas de IA.
people: [ddespinoza, Dani Espinoza Charrier]
automation: ["dependabot[bot]"]

tools:
  - tool: Claude Code
    provider: Anthropic
    models: ["Claude Opus 5.5", "Claude Opus 5 (1M context)", "Claude Opus 4.8", "Claude Opus 4.8 (1M context)", "Claude Fable 5.1", "Claude Sonnet 5.5", "Claude Sonnet 5", "Claude Haiku 4.5"]
    use: "Código, pruebas, documentación, revisión de pull requests y los flujos multiagente (entre ellos el tejido de la documentación de Nextcloud)."
    since: "2026-07-18"
    review: "Cada cambio entra por pull request con compuertas automáticas y la etiqueta ai-assisted."
  - tool: Pi con rpiv (rpiv-pi)
    provider: "Zhipu AI, vía OpenRouter hasta el 2026-10-04 y vía z.ai desde entonces"
    models: ["GLM-5.3"]
    use: "Orquestación de flujos rpiv por etapas: investigación, diseño, plan, implementación y validación, con aprobación del plan."
    since: "2026-09-25"
    review: "El plan de cada corrida espera aprobación; el resultado entra por pull request con compuertas automáticas."
    note: "Los modelos anteriores a la configuración del 2026-10-04 no quedaron registrados."
