# Catálogo de los repositorios que documenta el sitio.
# Claves en inglés, valores legibles en español; la enumeración machine de
# `kind` es un enum EN (vocabulario de la compuerta de paridad y del generador
# de mapas) y se traduce en la página generada — ver KIND_ES en
# tools/gen-catalogo.py, que garantiza que ningún valor EN del enum llega a la
# superficie renderizada.
# `role`: tools/about-sync.py lo replica en la descripción del repositorio en GitHub.
org: APS-Conecta
out_of_scope: [aps-conecta-web, calculadora-ecicep]
repos:
  - repo: gestion
    kind: distribution-fork
    role: "La suite APS Conecta Gestión en un repositorio: el instalador firmado (fork de Nextcloud AIO), el tema, los datos nacionales, las decisiones y la cadena de publicación de versiones. Una instalación por establecimiento; sin datos de pacientes."
    manuals:
      - administracion/arquitectura.md
      - administracion/usuarios-y-grupos/index.md
      - administracion/oficina/index.md
      - administracion/seguridad.md
      - administracion/aio.md
      - administracion/instalacion/index.md
      - administracion/aprovisionamiento.md
      - administracion/mapas-base.md
      - administracion/operaciones/index.md
      - desarrollo/gestion.md
      - desarrollo/aio.md
      - desarrollo/instalador.md
      - proyecto/novedades/gestion.md
      - proyecto/novedades/instalador.md
    depends_on: [IntraVox, farmacia, estadistica, epidemiologia, territorio]
    status: "Activa — el repositorio de la suite desde el corte: absorbió al gestion antiguo y tomó su nombre (#53)"
    version: "0.5.0"
  - repo: IntraVox
    kind: nextcloud-app
    role: "Intranet de la organización — fork propio de IntraVox (páginas colaborativas con editor visual de arrastre), aplicación Nextcloud 34 para el personal del CESFAM."
    manuals:
      - usuario/inicio.md
      - desarrollo/intravox.md
      - proyecto/novedades/intravox.md
    depends_on: [aps-common]
    status: "En la suite desde v3.1.0-aps1 (2026-09-25)"
    readme: .github/README.md
  - repo: buscador-documental
    kind: app-in-design
    role: "Buscador Documental: busca por palabras o por significado, incluidos escaneos y fotografías, respetando los permisos de Nextcloud."
    manuals:
      - usuario/buscador-documental.md
      - administracion/ia/buscador-documental.md
      - desarrollo/buscador-documental.md
    depends_on: [gestion]
    status: "Construida — fuera de la suite"
  - repo: totem
    kind: nextcloud-app
    role: "Turnos de atención para CESFAM, CECOSF y SAPU: la persona retira su número en el tótem, la pantalla de sala lo anuncia con voz en español y la ventanilla avanza la fila."
    manuals:
      - desarrollo/totem.md
      - proyecto/novedades/totem.md
    depends_on: [aps-common]
    status: "Opcional del asistente desde v0.3.0 — desactivada por omisión"
  - repo: farmacia
    kind: nextcloud-app
    role: "Vademécum y arsenal farmacológico del CESFAM con importación CSV por etapas — app Nextcloud 34."
    manuals:
      - usuario/farmacia.md
      - desarrollo/farmacia.md
      - proyecto/novedades/farmacia.md
    depends_on: [aps-common]
    status: "En la suite desde v0.11.1"
  - repo: estadistica
    kind: nextcloud-app
    role: "Cifras REM del establecimiento junto al promedio nacional y de pares, y el avance de las Metas Sanitarias"
    manuals:
      - usuario/estadistica.md
      - desarrollo/estadistica.md
      - proyecto/novedades/estadistica.md
    depends_on: [aps-common]
    soft_depends_on: [Databases] # arista doctrinal (inventarios REM), no de construcción
    status: "En la suite desde v0.1.0 (2026-09-30)"
  - repo: epidemiologia
    kind: nextcloud-app
    role: "Información epidemiológica del MINSAL (alertas, IRAG, dashboard) — app Nextcloud 34 para el personal del CESFAM."
    manuals:
      - usuario/epidemiologia.md
      - desarrollo/epidemiologia.md
      - proyecto/novedades/epidemiologia.md
    depends_on: [aps-common]
    status: "Activa"
  - repo: territorio
    kind: nextcloud-app
    role: "Cartografía territorial y asignación de sectores (OpenStreetMap) — app Nextcloud 34 para el CESFAM."
    manuals:
      - usuario/territorio.md
      - desarrollo/territorio.md
      - proyecto/novedades/territorio.md
    depends_on: [aps-common]
    status: "En la suite desde v0.74.0 (2026-09)"
  - repo: side_menu
    kind: nextcloud-app
    role: "Menú lateral personalizado — Custom menu de Simon Vieille (AGPL 6.0.1), mantenido como fork propio porque su fuente, gitnet.fr, está inaccesible."
    manuals:
      - desarrollo/side_menu.md
      - proyecto/novedades/side_menu.md
    depends_on: []
    status: "En la suite desde 6.0.1 (2026-10-24)"
  - repo: spreed
    kind: nextcloud-app
    role: "Talk de la suite — fork propio de spreed con releases firmadas: el chat y las videollamadas internas del establecimiento, sin salir a servicios de terceros."
    manuals:
      - proyecto/novedades/spreed.md
    depends_on: [gestion]
    status: "Activo"
    version: "24.0.6"
  - repo: eurooffice
    kind: nextcloud-app
    role: "Conector de Euro-Office para Nextcloud: edición en línea de documentos, planillas y presentaciones; fork propio del upstream."
    manuals:
      - administracion/oficina/index.md
      - desarrollo/eurooffice.md
      - proyecto/novedades/eurooffice.md
    depends_on: []
    status: "Fork recién creado; entra a la suite con su primera release"
  - repo: desktop_workspace
    kind: nextcloud-app
    role: "Espacio de escritorio para Nextcloud — fork propio del upstream, con los cambios de la suite como commits separados."
    manuals:
      - desarrollo/desktop_workspace.md
      - proyecto/novedades/desktop_workspace.md
    depends_on: []
    status: "Fork recién creado; entra a la suite con su primera release"
  - repo: aps-common
    kind: shared-library
    role: "Reglas de texto compartidas por las aplicaciones propias de APS Conecta: dialecto CSV, familia fold/slug, postura de rechazo y forma del error de cliente (PHP + JS)."
    manuals:
      - desarrollo/aps-common.md
      - desarrollo/desarrollo-de-aplicaciones.md
    depends_on: []
    status: "Estable"
  - repo: Databases
    kind: data-corpus
    role: "Corpus textual de normativa sanitaria chilena, catálogo de APIs de fuentes oficiales e inventario REM (compuertas de sondeo y verificación)."
    manuals:
      - desarrollo/databases.md
    depends_on: []
    status: "Activo"
  - repo: .github
    kind: org-defaults
    role: "Valores por defecto a nivel de organización: perfil, guía de contribución, seguridad y plantillas de incidencia servidas a cada repositorio de APS-Conecta."
    manuals:
      - desarrollo/github-org.md
    depends_on: []
    status: "Activo"
  - repo: documentation
    kind: docs-site
    role: "Documentación de APS Conecta: manuales de usuario, administración y desarrollo"
    manuals:
      - desarrollo/documentation.md
    depends_on: []
    status: "Publicado"
